name: Deploy Money Tree staging frontend

on:
  workflow_dispatch:
  push:
    branches: [build/google-auth-foundation]
    paths:
      - '.github/workflows/deploy-money-tree-staging.yml'
      - 'apps/web/**'
      - 'apps/gateway/**'
      - 'infra/wrangler.staging.json'

permissions:
  contents: read

concurrency:
  group: money-tree-staging-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact staging target
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const config=JSON.parse(fs.readFileSync("infra/wrangler.staging.json","utf8"));
            if(config.name!=="pocket-analytics-staging" ||
              config.main!=="../apps/gateway/index.mjs" ||
              config.assets?.directory!=="../apps/web" ||
              config.keep_vars!==true)
              throw Error("Refusing non-staging deployment target");
          '
      - name: Test authenticated dashboard and profitability colors
        run: |
          node --test tests/test_bot_table.mjs tests/test_strategy_folders.mjs
          node tests/test_favorites_profit_colors.mjs
          node tests/test_demo_gateway.mjs
      - name: Verify Cloudflare deployment credentials are present
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Publish ONLY Money Tree staging Worker and apps/web assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config infra/wrangler.staging.json
