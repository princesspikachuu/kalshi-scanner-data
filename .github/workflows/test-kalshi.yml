
name: Update Kalshi Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: kalshi-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Retrieve Kalshi markets
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path

          base = (
              "https://external-api.kalshi.com"
              "/trade-api/v2/markets"
          )

          now = int(time.time())
          end = now + 86400
          markets = []
          cursor = ""
          complete = False

          for page in range(10):
              params = {
                  "status": "open",
                  "mve_filter": "exclude",
                  "min_close_ts": now,
                  "max_close_ts": end,
                  "limit": 1000
              }

              if cursor:
                  params["cursor"] = cursor

              url = base + "?" + urllib.parse.urlencode(params)

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "KalshiPocketScanner/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=45
              ) as response:
                  data = json.load(response)

              markets.extend(data.get("markets", []))
              cursor = data.get("cursor") or ""

              print(
                  "Page", page + 1,
                  "Total markets:", len(markets)
              )

              if not cursor:
                  complete = True
                  break

              time.sleep(1)

          output = {
              "updated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "window_hours": 24,
              "complete": complete,
              "markets": markets
          }

          Path("data").mkdir(exist_ok=True)
          Path("data/markets.json").write_text(
              json.dumps(output, separators=(",", ":")),
              encoding="utf-8"
          )

          print("SUCCESS!")
          print("Markets saved:", len(markets))
          print("Complete scan:", complete)
          PY

      - name: Publish market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update Kalshi market data"
            git push
          fi
