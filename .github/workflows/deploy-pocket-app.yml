name: Deploy Pocket Analytics dynamic Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_ACTIONS_TOKEN: ${{ secrets.POCKET_GITHUB_ACTIONS_TOKEN }}
          ADMIN_KEY: ${{ secrets.POCKET_APP_ADMIN_KEY }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GH_ACTIONS_TOKEN" || { echo "Missing POCKET_GITHUB_ACTIONS_TOKEN"; exit 1; }
          test -n "$ADMIN_KEY" || { echo "Missing POCKET_APP_ADMIN_KEY"; exit 1; }
      - name: Deploy Worker and static app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Configure server-side GitHub Actions token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SECRET: ${{ secrets.POCKET_GITHUB_ACTIONS_TOKEN }}
        run: printf '%s' "$WORKER_SECRET" | npx --yes wrangler@4 secret put GITHUB_ACTIONS_TOKEN
      - name: Configure server-side app access key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SECRET: ${{ secrets.POCKET_APP_ADMIN_KEY }}
        run: printf '%s' "$WORKER_SECRET" | npx --yes wrangler@4 secret put APP_ADMIN_KEY
