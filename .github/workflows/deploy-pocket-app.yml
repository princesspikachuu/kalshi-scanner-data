name: Deploy Pocket Analytics dynamic Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/manifest.webmanifest'
      - 'docs/icon.svg'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-pocket-app.yml'
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build conditional loss-risk report and verify app
        run: |
          python3 scripts/loss_prevention.py
          cp backtests/LOSS_PREVENTION.json docs/loss-prevention.json
          python3 -m unittest discover -s tests -q
          node tests/test_dashboard_views.mjs
      - name: Validate required deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_ACTIONS_TOKEN: ${{ secrets.POCKET_GITHUB_ACTIONS_TOKEN }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$GH_ACTIONS_TOKEN" || { echo "Missing POCKET_GITHUB_ACTIONS_TOKEN"; exit 1; }
      - name: Deploy Worker and static app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Configure server-side GitHub Actions token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_SECRET: ${{ secrets.POCKET_GITHUB_ACTIONS_TOKEN }}
        run: printf '%s' "$WORKER_SECRET" | npx --yes wrangler@4 secret put GITHUB_ACTIONS_TOKEN


  staging:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/build/google-auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: pocket-staging-gateway
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test staging gateway boundaries
        run: node --test tests/test_login_bridge.mjs
      - name: Validate isolated deployment configuration
        run: node scripts/check_staging_gateway.mjs
      - name: Validate existing Cloudflare connection
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy separate staging gateway only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.153.0 deploy --config infra/wrangler.staging.json
      - name: Check public staging boundary without credentials
        run: python3 scripts/check_staging_http.py
